# Model routing for the JSAN Dev AI gateway.
#
# The portal offers four logical modes and sends the mode name as the model
# name (see DEV_MODELS in portal/backend/src/server.js). The model_name values
# below MUST stay exactly `auto`, `code`, `think` and `fast` — developer
# virtual keys are scoped to those four names at issue time.
#
# All four route through OpenRouter so the platform needs one credential
# instead of one per provider. To move a mode onto a direct provider key
# later, change its `model` and `api_key` here; nothing else changes.
#
# Adding a SECOND entry with the same model_name load-balances across both
# (routing_strategy below) — that is how to add redundancy per mode.

model_list:
  # Everyday work. Large context, low cost.
  - model_name: auto
    litellm_params:
      model: openrouter/google/gemini-3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8000

  # Implementation, debugging, code review.
  - model_name: code
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8000

  # Architecture and deeper reasoning. Most expensive per token —
  # keep DEVELOPER_MONTHLY_BUDGET_USD set on the portal.
  - model_name: think
    litellm_params:
      model: openrouter/anthropic/claude-opus-5
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8000

  # Quick answers and small tasks.
  - model_name: fast
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  allowed_fails: 2
  cooldown_time: 30
  # If a mode's provider is failing or rate limited, serve the request from
  # a neighbouring mode rather than returning an error to the developer.
  fallbacks:
    - auto: ["fast"]
    - code: ["think"]
    - think: ["code"]
    - fast: ["auto"]

litellm_settings:
  set_verbose: false
  drop_params: true
